model:
  name: "VietAI/vit5-base"

data:
  train_pairs: "/kaggle/working/data/stage2_pairs.jsonl"
  max_source_length: 64
  max_target_length: 64
  batch_size: 16
  num_workers: 2

training:
  num_epochs: 30
  lr: 5e-5
  weight_decay: 0.01
  device: "auto"
  grad_clip: 1.0

logging:
  ckpt_dir: "/kaggle/working/outputs/stage2_checkpoints"
  log_every: 100
