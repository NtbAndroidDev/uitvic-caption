model:
  name: "Salesforce/blip-image-captioning-base"

data:
  train_json: "/kaggle/input/datasets/leo040802/uitvic-dataset/uitvic_dataset/uitvic_captions_train2017.json"
  val_json:   "/kaggle/input/datasets/leo040802/uitvic-dataset/uitvic_dataset/uitvic_captions_test2017.json"
  train_image_root: "/kaggle/input/datasets/leo040802/uitvic-dataset/uitvic_dataset/coco_uitvic_train/coco_uitvic_train"
  val_image_root:   "/kaggle/input/datasets/leo040802/uitvic-dataset/uitvic_dataset/coco_uitvic_test/coco_uitvic_test"

  max_length: 40
  batch_size: 8
  num_workers: 2

training:
  num_epochs: 500
  lr: 2e-5
  early_stopping_patience: 5
  weight_decay: 0.01
  device: "auto"
  grad_clip: 1.0


logging:
  ckpt_dir: "outputs/checkpoints"
  log_every: 50          # in loss mỗi 50 batch
  save_every_epoch: 1
