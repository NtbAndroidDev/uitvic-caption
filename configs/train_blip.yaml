model:
  name: "Salesforce/blip-image-captioning-base"

data:
  train_json: "data/uitvic_dataset/uitvic_captions_train_new.json"
  val_json:   "data/uitvic_dataset/uitvic_captions_val2017.json"
  train_image_root: "data/uitvic_dataset/coco_uitvic_train/coco_uitvic_train"
  val_image_root:   "data/uitvic_dataset/coco_uitvic_train/coco_uitvic_train"  # vì val cũng lấy từ train

  max_length: 40
  batch_size: 8
  num_workers: 2

training:
  num_epochs: 3
  lr: 5e-5
  weight_decay: 0.01
  device: "auto"
  grad_clip: 1.0


logging:
  ckpt_dir: "outputs/checkpoints"
  log_every: 50          # in loss mỗi 50 batch
  save_every_epoch: 1
