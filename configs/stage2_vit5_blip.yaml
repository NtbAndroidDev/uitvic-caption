model:
  name: "VietAI/vit5-base"

data:
  train_pairs: "data/stage2_pairs_blip.jsonl"
  max_source_length: 64
  max_target_length: 64
  batch_size: 8
  num_workers: 0

training:
  num_epochs: 500
  lr: 2e-5
  early_stopping_patience: 5
  weight_decay: 0.01
  device: "auto"
  grad_clip: 1.0

logging:
  ckpt_dir: "outputs/stage2_checkpoints_blip"
  log_every: 100
